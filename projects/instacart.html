<head>
	<title>Air Quality Forecasting | Phuong Viet Dang</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="description" content="Air quality forecasting project using Python, TensorFlow, GRU and LSTM models." />

	<link rel="icon" type="image/svg+xml" href="../images/favicon.svg?v=4" />
	<link rel="shortcut icon" type="image/svg+xml" href="../images/favicon.svg?v=4" />
	<link rel="stylesheet" href="../assets/css/main.css" />

	<style>
		:root {
			--accent: #2563eb;
			--accent-dark: #1d4ed8;
			--navy: #0f172a;
			--soft-bg: #f8fafc;
		}

		a {
			color: var(--accent);
		}

		a:hover {
			color: var(--accent-dark) !important;
		}

		strong, b {
			color: var(--navy);
		}

		.button {
			box-shadow: inset 0 0 0 2px var(--accent);
			color: var(--accent) !important;
		}

		.button:hover {
			background-color: rgba(37, 99, 235, 0.08);
			box-shadow: inset 0 0 0 2px var(--accent-dark);
			color: var(--accent-dark) !important;
		}

		.button.primary {
			background-color: var(--accent);
			box-shadow: none;
			color: #ffffff !important;
		}

		.button.primary:hover {
			background-color: var(--accent-dark);
		}

		header.major > :last-child,
		#header {
			border-bottom-color: var(--accent);
		}

		#menu ul a:hover,
		#menu ul span:hover,
		#menu ul a.opener:before,
		#menu ul span.opener:before {
			color: var(--accent);
		}

		.icon.solid:before,
		.icon.brands:before {
			color: var(--accent);
		}

		#sidebar {
			background-color: var(--soft-bg);
		}

		.top-page-actions {
			margin: 2rem 0 0 0;
		}

		.image.main img {
			max-height: 620px;
			object-fit: contain;
			object-position: top center;
			background: #f7f7f7;
		}
	</style>
